[package]
name = "orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
rust_xlsxwriter = "0.99.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

# ── Preprocessing (Task 10) ───────────────────────────────────────────────────
rayon      = "1"                                                # Parallel iterators
image      = { version = "0.25", features = ["jpeg", "png"] }                  # Header-only dimension reads
blake3     = "1"                                                # Fast file hashing
walkdir    = "2"                                                # Recursive directory walk
indicatif  = "0.17"                                             # Progress bars


