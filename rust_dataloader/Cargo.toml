[package]
name = "rust_dataloader"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib = Python-loadable shared library (.pyd on Windows, .so on Linux)
name = "rust_dataloader"
crate-type = ["cdylib"]

[dependencies]
# PyO3 — Python ↔ Rust bridge (0.23+ has full Python 3.13 support)
pyo3 = { version = "0.23", features = ["extension-module"] }

# Image decode (JPEG/PNG)
image = { version = "0.25", features = ["jpeg", "png"] }

# Parallel iterators — multi-core data loading
rayon = "1"

# COCO JSON parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Random number generation for augmentations
rand = "0.9"

# Fast polygon rasterization
imageproc = "0.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
